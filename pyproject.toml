[project]
name = "tender-radar"
version = "0.1.0"
description = "Public Tender Intelligence Agent: governed tender data over MCP, with evals"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pyarrow>=17.0",
    "mcp>=1.2",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "dbt-duckdb>=1.9",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
tender-radar-mcp = "tender_radar.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
