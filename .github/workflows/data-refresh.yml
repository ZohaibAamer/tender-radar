# Data refresh and LLM evals — manual by design.
#
# This repo is a reference implementation, not an operated service: nothing
# runs unattended. Trigger this workflow from the Actions tab when you want
# fresh data or an eval run. To operate it on a schedule instead, add:
#
#   schedule:
#     - cron: "14 2 * * *"
#
# (and consider a keepalive action — public-repo schedules pause after 60
# days without activity).
name: Data refresh & evals

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Also create a dated snapshot release
        type: boolean
        default: false
      run_evals:
        description: Run the 52-question LLM eval suite (needs GEMINI_API_KEY secret)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download current data release
        run: |
          mkdir -p data/raw data/links
          gh release download data-latest --dir data/raw \
            --pattern '*.parquet' --clobber || echo "no release yet"
          mv data/raw/tender_links.parquet data/links/ 2>/dev/null || true

      - name: Incremental ingest (last 7 days, idempotent merge)
        run: uv run python -m tender_radar.ingest --source all

      - name: dbt build and source freshness
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: |
          uv run dbt deps --project-dir dbt
          uv run dbt build --project-dir dbt
          uv run dbt source freshness --project-dir dbt

      - name: Cross-portal dedup links
        run: uv run python -m tender_radar.dedupe

      - name: Upload to rolling release
        run: |
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Tender data (rolling)" \
              --notes "Refreshed parquet. See DATA_LICENSE.md for source attribution."
          gh release upload data-latest data/raw/*.parquet data/links/tender_links.parquet --clobber

      - name: Dated snapshot release
        if: ${{ inputs.snapshot }}
        run: |
          tag="data-$(date -u +%Y-%m-%d)"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Tender data snapshot $tag" \
              --notes "Snapshot of the rolling data release." \
              data/raw/*.parquet data/links/tender_links.parquet

  agent-evals:
    runs-on: ubuntu-latest
    if: ${{ inputs.run_evals }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build the fixture warehouse
        env:
          TENDER_RADAR_DATA_DIR: ${{ github.workspace }}/fixtures
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: |
          uv run dbt deps --project-dir dbt
          uv run dbt build --project-dir dbt

      - name: Run the 52-question eval suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY not available — skipping LLM evals"
            exit 0
          fi
          uv run python evals/harness.py

      - name: Publish eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report.json
          if-no-files-found: ignore
